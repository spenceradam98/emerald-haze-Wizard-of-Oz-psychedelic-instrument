name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  VERSION: 0.1.0

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal, macOS 11.0+)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --target EmeraldHaze_VST3 EmeraldHaze_AU EmeraldHaze_Standalone -- -quiet
      - name: Check both architectures are present
        run: lipo -info "build/EmeraldHaze_artefacts/Release/VST3/Emerald Haze.vst3/Contents/MacOS/Emerald Haze"
      - name: Make DMG
        run: installer/mac/make-dmg.sh build/EmeraldHaze_artefacts/Release "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with: { name: EmeraldHaze-macOS, path: dist/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target EmeraldHaze_VST3 EmeraldHaze_Standalone
      - name: Make installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=$env:VERSION" "/DArtefacts=$env:GITHUB_WORKSPACE\build\EmeraldHaze_artefacts\Release" "/O$env:GITHUB_WORKSPACE\dist" installer\windows\EmeraldHaze.iss
      - uses: actions/upload-artifact@v4
        with: { name: EmeraldHaze-Windows, path: dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
